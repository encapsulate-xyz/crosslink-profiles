# Checks a claim pull request and merges it when every check passes.
#
# pull_request_target runs this file and tools/ from main, never from the pull request: the
# claim file is fetched and read as data. The check job, which installs a package, can only read;
# the apply job, which can write, runs the standard library alone and acts on the check's result.
name: Check claim

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths: ["claims/**"]

permissions: {}

concurrency:
  group: claim-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.action != 'labeled' || github.event.label.name == 'review-approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install the checks' dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r tools/requirements.txt
      - name: Check the claim
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHAIN_API: ${{ vars.CHAIN_API }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" tools/ci.py check --out "$RUNNER_TEMP/result.json"
          echo "result=$(base64 -w0 "$RUNNER_TEMP/result.json")" >> "$GITHUB_OUTPUT"

  apply:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Comment, label, and merge or close
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.outputs.result }}
          CLAIM_BOT: ${{ vars.CLAIM_BOT }}
        run: python3 tools/ci.py apply
